id: GME-07
name: "Game Kill Switch and Version Disable"
release: R8
status: DONE
dependencies:
  - GME-01
  - ADM-06
dependency_notes: >
  Disable aborts active sessions; host polls play status and shows kill copy.
applications:
  - student_app
  - packages
  - docs
  - automation
  - supabase
allowed_paths:
  - apps/student_app/
  - apps/admin_web/
  - packages/nano_domain/
  - packages/nano_data/
  - packages/nano_games/
  - packages/nano_testing/
  - supabase/migrations/
  - supabase/tests/
  - docs/
  - automation/
  - docs/modules/GME-07/
  - automation/modules/GME-07.yaml
  - automation/modules/GME-06.yaml
  - MODULE_STATUS.md
  - PROJECT_STATUS.md
  - TASKS.md
  - CHANGELOG.md
forbidden_paths:
  - supabase/functions/.env.local
  - api_s.txt
  - github.txt
handbook_sections:
  - "Handbook remote kill switch for games"
ui_references: []
database_scope:
  - public.game_sessions
  - public.game_versions
server_functions:
  - "public.disable_game_version"
  - "public.get_game_session_play_status"
acceptance:
  - Disable aborts active sessions for that version
  - Start on disabled version maps to learner disabled copy
  - Host poll detects kill switch and stops play surface
  - Module documentation complete
required_tests:
  - supabase/tests/gme07_game_kill_switch.sql
  - packages/nano_domain/test/game_session_test.dart
  - packages/nano_data/test/game_session_repository_test.dart
  - apps/student_app/test/game_host_kill_switch_test.dart
security_checks:
  - no_secrets_in_diff
  - server_side_disable_authority
accessibility_checks: []
manual_test_steps:
  - Disable a live game in admin; confirm student host kill messaging
rollback_notes: >
  Revert branch and migration. Disable returns to catalog-only hide.
requires_owner_test: true
owner_decisions_locked:
  scope: >
    Abort on disable + host poll + dedicated learner copy.
  deferred: >
    Push/realtime invalidate; CDN purge; re-enable republish flow polish.
