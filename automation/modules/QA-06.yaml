id: QA-06
name: "Pilot Release Preparation"
release: R10
status: USER_TEST
dependencies:
  - QA-01
  - QA-02
  - QA-03
  - QA-04
  - QA-05
applications:
  - admin_web
  - packages
  - docs
  - automation
allowed_paths:
  - docs/
  - automation/
  - docs/modules/QA-06/
  - automation/modules/QA-06.yaml
  - MODULE_STATUS.md
  - PROJECT_STATUS.md
  - TASKS.md
  - CHANGELOG.md
  - AGENTS.md
  - packages/nano_domain/
  - packages/nano_data/
  - apps/admin_web/
forbidden_paths:
  - supabase/functions/.env.local
  - api_s.txt
  - github.txt
handbook_sections:
  - "See docs/handbook/HANDBOOK_TRACEABILITY.md for QA-06"
ui_references: []
database_scope: []
server_functions: []
acceptance:
  - Pilot readiness checklist is executable for superadmin
  - QA-01..QA-05 gates are represented on the checklist
  - Ops gates cover flags, kill switch, RLS, backup, and pilot scripts
  - Module documentation complete
  - Required tests listed and executed or marked NOT RUN with reason
  - No secrets exposed
  - Owner manual test steps provided
required_tests:
  - packages/nano_domain/test/pilot_release_test.dart
  - packages/nano_data/test/pilot_release_repository_test.dart
  - apps/admin_web/test/pilot_release_page_test.dart
  - documentation_review
security_checks:
  - no_secrets_in_diff
accessibility_checks: []
manual_test_steps:
  - Superadmin → Pilot → all pilot gates passed
rollback_notes: "Revert module branch commits"
requires_owner_test: true
