acceptance:
  - Master avatar preserved; transparent cutout exists
  - Active runtime uses humanoid CompanionPosePack, not purple mascot
  - Student profile avatar remains separate from companion
  - Junior profile fox replaced by humanoid portrait
  - Default voice id is gentle_young_male_c48e8683; Aoede not active default
  - Captions work with sound off
  - Missing clip/voice falls back safely
  - Dev gallery /dev/companion-cmp04 (debug only)
  - Tests pass; USER_TEST docs ready
required_tests:
  - packages/nano_design_system/test/nori_pose_pack_test.dart
  - packages/nano_domain/test/companion_runtime_test.dart
  - packages/nano_domain/test/companion_identity_test.dart
security_checks:
  - no_secrets_in_diff
  - no_provider_keys_in_flutter
  - companion_cannot_author_scores
accessibility_checks:
  - captions_when_sound_off
  - static_art_under_reduced_motion
  - classroom_mode_suppresses_non_essential
manual_test_steps:
  - Open /dev/companion-cmp04 and review identity pack
  - Junior profile: humanoid portrait top-right; student avatar top-left
  - Home greeting once per session; no purple bean
  - Sound off: captions only
  - Reduced motion: static poses only
  - Classroom Mode: essential only
rollback_notes: "Revert module branch; restore previous narration_voices default via migration reverse if applied"
requires_owner_test: true
