id: STU-02
name: "Nori Naming, Language, Sound, and Accessibility Setup"
release: R1
status: USER_TEST
dependencies:
  - STU-01
applications:
  - student_app
  - packages
  - supabase
  - docs
  - automation
allowed_paths:
  - docs/
  - automation/
  - docs/modules/STU-02/
  - automation/modules/STU-02.yaml
  - apps/student_app/
  - packages/nano_domain/
  - packages/nano_data/
  - supabase/
  - MODULE_STATUS.md
  - PROJECT_STATUS.md
  - TASKS.md
  - CHANGELOG.md
  - AGENTS.md
forbidden_paths:
  - supabase/functions/.env.local
  - api_s.txt
  - github.txt
handbook_sections:
  - "STU-01 Student Onboarding and Preferences (companion name, language, sound, accessibility)"
ui_references: []
database_scope:
  - public.student_preferences
  - public.student_onboarding
server_functions: []
acceptance:
  - Companion name defaults to Nori and rejects blank or invalid names
  - Language and accessibility apply live during setup
  - Preferences sync to the server and restore on next launch
  - Preference rows are owner-only; platform admins cannot read them
  - Independent and school learners both complete the setup step
  - No secrets exposed
required_tests:
  - supabase/tests/stu02_preferences_isolation.sql
  - packages/nano_domain/test/student_preferences_test.dart
  - packages/nano_data/test/student_preferences_repository_test.dart
  - apps/student_app/test/onboarding_flow_test.dart
security_checks:
  - no_secrets_in_diff
  - owner_only_preferences
  - blank_companion_name_rejected
accessibility_checks:
  - live_locale_rtl
  - reduced_motion_toggle
manual_test_steps:
  - See docs/modules/STU-02/MANUAL_TEST.md
rollback_notes: "Drop public.student_preferences and restore the four-step onboarding check; revert module branch commits"
requires_owner_test: true
