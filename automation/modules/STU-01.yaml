id: STU-01
name: "Student First-Run Onboarding"
release: R1
status: APPROVED
dependencies:
  - AUTH-01
  - FND-06
  - FND-07
applications:
  - student_app
  - packages
  - supabase
  - docs
  - automation
allowed_paths:
  - docs/
  - automation/
  - docs/modules/STU-01/
  - automation/modules/STU-01.yaml
  - apps/student_app/
  - packages/nano_domain/
  - packages/nano_data/
  - supabase/
  - MODULE_STATUS.md
  - PROJECT_STATUS.md
  - TASKS.md
  - CHANGELOG.md
  - AGENTS.md
forbidden_paths:
  - supabase/functions/.env.local
  - api_s.txt
  - github.txt
handbook_sections:
  - "STU-01 Student Onboarding and Preferences (first-run portion; preferences are STU-02)"
ui_references: []
database_scope:
  - public.student_onboarding
  - nano_internal.is_student
server_functions:
  - nano_internal.is_student
acceptance:
  - Onboarding resumes at the saved step after interruption
  - Experience track derives from grade policy with override support
  - Independent onboarding never promises school-only features
  - Onboarding progress is readable and writable only by its owner
  - Non-student accounts cannot create onboarding rows
  - Copy is available in English and Urdu
  - No secrets exposed
required_tests:
  - supabase/tests/stu01_onboarding_isolation.sql
  - packages/nano_domain/test/onboarding_models_test.dart
  - packages/nano_data/test/onboarding_repository_test.dart
  - apps/student_app/test/onboarding_flow_test.dart
security_checks:
  - no_secrets_in_diff
  - cross_user_onboarding_isolation
  - students_only_write_guard
accessibility_checks:
  - step_progress_semantics
  - urdu_rtl_copy
manual_test_steps:
  - See docs/modules/STU-01/MANUAL_TEST.md
rollback_notes: "Drop public.student_onboarding and nano_internal.is_student; revert module branch commits"
requires_owner_test: true
