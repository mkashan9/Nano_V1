id: IND-03
name: "Trial, Free, and Paid States"
release: R10
status: USER_TEST
dependencies:
  - IND-02
applications:
  - student_app
  - packages
  - docs
  - automation
allowed_paths:
  - docs/
  - automation/
  - docs/modules/IND-03/
  - automation/modules/IND-03.yaml
  - MODULE_STATUS.md
  - PROJECT_STATUS.md
  - TASKS.md
  - CHANGELOG.md
  - AGENTS.md
  - packages/nano_domain/
  - packages/nano_data/
  - apps/student_app/
forbidden_paths:
  - supabase/functions/.env.local
  - api_s.txt
  - github.txt
handbook_sections:
  - "See docs/handbook/HANDBOOK_TRACEABILITY.md for IND-03"
ui_references: []
database_scope: []
server_functions: []
acceptance:
  - Free / trial / paid / grace / expired map onto IND-02 entitlements
  - Me shows plan status and calm Start free trial when free
  - Expired reduces games while learning stays open
  - No payment capture (BIL-01)
  - Module documentation complete
  - Required tests listed and executed or marked NOT RUN with reason
  - No secrets exposed
  - Owner manual test steps provided
required_tests:
  - packages/nano_domain/test/independent_plan_test.dart
  - packages/nano_data/test/independent_access_repository_test.dart
  - apps/student_app/test/independent_plan_profile_test.dart
  - documentation_review
security_checks:
  - no_secrets_in_diff
accessibility_checks: []
manual_test_steps:
  - Independent Me shows Trial by default
  - Free seed → Start free trial
  - Expired seed → reduced games, learning open
rollback_notes: "Revert module branch commits"
requires_owner_test: true
