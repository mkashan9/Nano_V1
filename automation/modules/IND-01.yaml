id: IND-01
name: "Independent Student Home and Natural Navigation"
release: R10
status: USER_TEST
dependencies:
  - STU-04
  - AUTH-04
applications:
  - student_app
  - packages
  - docs
  - automation
allowed_paths:
  - docs/
  - automation/
  - docs/modules/IND-01/
  - automation/modules/IND-01.yaml
  - MODULE_STATUS.md
  - PROJECT_STATUS.md
  - TASKS.md
  - CHANGELOG.md
  - AGENTS.md
  - packages/nano_domain/
  - packages/nano_data/
  - apps/student_app/
forbidden_paths:
  - supabase/functions/.env.local
  - api_s.txt
  - github.txt
handbook_sections:
  - "See docs/handbook/HANDBOOK_TRACEABILITY.md for IND-01"
ui_references: []
database_scope: []
server_functions: []
acceptance:
  - Independent nav uses Home / Play / Me without Flex
  - Home shows play/learn spotlight instead of Flex or school update
  - Spotlight deep-links via DeepLinkResolver
  - Module documentation complete
  - Required tests listed and executed or marked NOT RUN with reason
  - No secrets exposed
  - Owner manual test steps provided
required_tests:
  - packages/nano_domain/test/student_home_summary_test.dart
  - packages/nano_data/test/student_home_repository_test.dart
  - apps/student_app/test/senior_home_page_test.dart
  - apps/student_app/test/shell_navigation_test.dart
  - documentation_review
security_checks:
  - no_secrets_in_diff
accessibility_checks: []
manual_test_steps:
  - Switch to Independent role
  - Confirm Home / Play / Me and no Flex
  - Tap Play next → Games
rollback_notes: "Revert module branch commits"
requires_owner_test: true
