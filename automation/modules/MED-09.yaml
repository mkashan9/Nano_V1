id: MED-09
name: "Nori Character Sheet and Static Pose Pack"
release: R4
status: BACKLOG
dependencies:
  - MED-08
dependency_notes: >
  MED-08 gives the app the ability to show an approved image. This module
  gives it something worth showing. One approved picture exists today
  (guide_greeting_staticArt). The reachable reaction matrix is 25 mode and
  mood pairs, and reduced motion collapses every tier down to static art,
  so static art is the floor under the entire companion system. Pollinations
  sana cannot draw a consistent mascot; the curated upload path proven in
  MED-06 is the production route.
applications:
  - packages
  - student_app
  - supabase
  - docs
  - automation
allowed_paths:
  - apps/student_app/assets/
  - apps/student_app/pubspec.yaml
  - packages/nano_design_system/
  - packages/nano_media/
  - packages/nano_domain/
  - supabase/migrations/
  - supabase/tests/
  - docs/
  - automation/
  - docs/modules/MED-09/
  - automation/modules/MED-09.yaml
  - MODULE_STATUS.md
  - PROJECT_STATUS.md
  - TASKS.md
  - CHANGELOG.md
  - docs/handbook/HANDBOOK_TRACEABILITY.md
forbidden_paths:
  - supabase/functions/.env.local
  - api_s.txt
  - github.txt
handbook_sections:
  - "10.1 Nori identity"
  - "10.2 Companion asset ladder"
  - "See docs/handbook/HANDBOOK_TRACEABILITY.md for MED-09"
ui_references:
  - UI_reference/kids/
database_scope:
  - generated_assets (curated static art for every reachable slot)
  - companion_character_sheet (the locked canonical description each pose is judged against)
server_functions:
  - "reuse register_curated_asset from MED-06"
acceptance:
  - A single canonical character sheet defines Nori and is recorded, not just remembered
  - Every reachable mode and mood pair has approved static art in every aspect ratio a surface asks for
  - A reviewer can compare each new pose against the canonical sheet before approving it, because character drift is the expected failure
  - The app ships a bundled offline floor so Nori is never an icon, even with no network and nothing approved
  - Published art wins over bundled art; bundled art wins over the icon; the icon becomes unreachable in practice
  - Art is language neutral, so one pose serves English and Urdu
  - Junior and Senior both resolve every pose their policy can reach
  - Module documentation complete
required_tests:
  - supabase/tests/med09_pose_coverage.sql
  - packages/nano_media/test/companion_asset_catalog_test.dart
  - packages/nano_design_system/test/companion_art_test.dart
security_checks:
  - no_secrets_in_diff
  - curated_uploads_are_admin_only
  - every_pose_passes_review_before_publication
manual_test_steps:
  - Review the character sheet and confirm it is the Nori you want locked
  - Walk the Moderation queue and approve or reject each pose against that sheet
  - Confirm a rejected pose can be regenerated for the same slot
  - Fly the app in airplane mode and confirm Nori still appears
rollback_notes: >
  Revert the branch and reject the pose rows. Bundled art can stay; it is
  inert without the widget path.
requires_owner_test: true
owner_decisions_locked:
  production_route: >
    Curated uploads generated by the agent's own image tool, which produced
    the only art the owner has approved so far. Reference conditioning from
    the canonical sheet is mandatory on every pose.
  consistency: >
    Character drift across a generated pose sheet is the known failure of
    this approach. The reviewer gate exists to catch it and is expected to
    reject.
