id: IND-02
name: "Independent Access Rules and Entitlements"
release: R10
status: USER_TEST
dependencies:
  - IND-01
  - SEC-03
applications:
  - student_app
  - packages
  - docs
  - automation
allowed_paths:
  - docs/
  - automation/
  - docs/modules/IND-02/
  - automation/modules/IND-02.yaml
  - MODULE_STATUS.md
  - PROJECT_STATUS.md
  - TASKS.md
  - CHANGELOG.md
  - AGENTS.md
  - packages/nano_domain/
  - packages/nano_data/
  - apps/student_app/
forbidden_paths:
  - supabase/functions/.env.local
  - api_s.txt
  - github.txt
handbook_sections:
  - "See docs/handbook/HANDBOOK_TRACEABILITY.md for IND-02"
ui_references: []
database_scope: []
server_functions: []
acceptance:
  - Independent entitlements tiers full / limited / restricted
  - Home shows calm access banners when warranted
  - Me shows Access status for independents
  - Games blocked when not entitled; learning remains
  - Module documentation complete
  - Required tests listed and executed or marked NOT RUN with reason
  - No secrets exposed
  - Owner manual test steps provided
required_tests:
  - packages/nano_domain/test/independent_access_test.dart
  - packages/nano_data/test/independent_access_repository_test.dart
  - apps/student_app/test/independent_access_home_test.dart
  - documentation_review
security_checks:
  - no_secrets_in_diff
accessibility_checks: []
manual_test_steps:
  - Independent → Me Access card
  - Restricted seed → Games blocked, learning open
rollback_notes: "Revert module branch commits"
requires_owner_test: true
