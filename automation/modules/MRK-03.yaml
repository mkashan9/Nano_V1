id: MRK-03
name: "Marks Excel Download and Upload"
release: R7
status: USER_TEST
dependencies:
  - MRK-02
dependency_notes: >
  Commits into MRK-02 marks_entries via teacher_marks_save.
  Publish/correction remain MRK-04.
applications:
  - teacher_app
  - packages
  - docs
  - automation
  - supabase
allowed_paths:
  - apps/teacher_app/
  - packages/nano_domain/
  - packages/nano_data/
  - packages/nano_design_system/
  - packages/nano_testing/
  - supabase/migrations/
  - supabase/tests/
  - docs/
  - automation/
  - docs/modules/MRK-03/
  - automation/modules/MRK-03.yaml
  - automation/modules/MRK-02.yaml
  - MODULE_STATUS.md
  - PROJECT_STATUS.md
  - TASKS.md
  - CHANGELOG.md
  - docs/handbook/HANDBOOK_TRACEABILITY.md
forbidden_paths:
  - supabase/functions/.env.local
  - api_s.txt
  - github.txt
handbook_sections:
  - "Handbook MRK Excel import slice"
  - "See docs/handbook/HANDBOOK_TRACEABILITY.md for MRK-03"
ui_references: []
database_scope:
  - public.marks_import_jobs
  - public.marks_import_rows
  - public.marks_entries
  - public.assessments
server_functions:
  - "public.teacher_marks_template"
  - "public.preview_marks_import"
  - "public.commit_marks_import"
acceptance:
  - Template uses stable student IDs
  - Preview/commit produce same records as in-app save
  - Draft assessments only
  - Module documentation complete
required_tests:
  - supabase/tests/mrk03_marks_excel.sql
  - packages/nano_domain/test/marks_import_test.dart
  - packages/nano_data/test/marks_import_repository_test.dart
  - apps/teacher_app/test/teacher_marks_page_test.dart
security_checks:
  - no_secrets_in_diff
  - teacher_scoped_rpcs
  - stable_student_ids
manual_test_steps:
  - Load template on Marks grid
  - Preview and commit CSV import
rollback_notes: >
  Revert the branch and migration. Import UI can be removed; grid remains.
requires_owner_test: true
owner_decisions_locked:
  scope: >
    CSV/Excel-compatible template + preview + commit only.
  deferred: >
    Binary xlsx parser; MRK-04 publish/correct.
