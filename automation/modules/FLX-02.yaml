  - apps/student_app/test/flex_home_page_test.dart
security_checks:
  - no_secrets_in_diff
  - self_only_attendance_rpc
  - draft_sessions_excluded
manual_test_steps:
  - Open Flex Attendance and review month summary
rollback_notes: >
  Revert branch and migration. Flex hub Attendance returns to placeholder.
requires_owner_test: true
owner_decisions_locked:
  scope: >
    Student month attendance read view + self-only RPC.
  deferred: >
    Correction history UI; live hub counts; nested go_router.
