  Reads submitted attendance_entries for auth.uid only. Teacher ATT modules remain write authority.
applications:
  - student_app
  - packages
  - docs
  - automation
  - supabase
allowed_paths:
  - apps/student_app/
  - packages/nano_domain/
  - packages/nano_data/
  - packages/nano_design_system/
  - packages/nano_testing/
  - supabase/migrations/
  - supabase/tests/
  - docs/
  - automation/
  - docs/modules/FLX-02/
  - automation/modules/FLX-02.yaml
  - automation/modules/FLX-01.yaml
  - MODULE_STATUS.md
  - PROJECT_STATUS.md
  - TASKS.md
  - CHANGELOG.md
  - docs/handbook/HANDBOOK_TRACEABILITY.md
forbidden_paths:
  - supabase/functions/.env.local
  - api_s.txt
  - github.txt
handbook_sections:
  - "Handbook FLX-01 Student Flex — attendance"
  - "See docs/handbook/HANDBOOK_TRACEABILITY.md for FLX-02"
ui_references: []
database_scope:
  - public.attendance_entries
