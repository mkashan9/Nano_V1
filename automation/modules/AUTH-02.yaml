id: AUTH-02
name: "Teacher Authentication"
release: R1
status: USER_TEST
dependencies:
  - SEC-03
  - FND-04
applications:
  - student_app
  - teacher_app
  - admin_web
  - packages
  - supabase
  - docs
  - automation
allowed_paths:
  - docs/
  - automation/
  - docs/modules/AUTH-02/
  - automation/modules/AUTH-02.yaml
  - MODULE_STATUS.md
  - PROJECT_STATUS.md
  - TASKS.md
  - CHANGELOG.md
  - AGENTS.md
  - packages/nano_auth/
  - packages/nano_domain/
  - apps/teacher_app/
  - apps/student_app/
  - supabase/
forbidden_paths:
  - supabase/functions/.env.local
  - api_s.txt
  - github.txt
handbook_sections:
  - "See docs/handbook/HANDBOOK_TRACEABILITY.md for AUTH-02"
ui_references: []
database_scope:
  - auth.users
  - auth.identities
  - public.profiles
  - public.school_memberships
  - public.schools
server_functions: []
acceptance:
  - Teacher auth.users fixture bound to Ms Khan profile UUID
  - Teacher sign-in lands in Teacher shell when Supabase keys present
  - Sign out returns to sign-in
  - Student accounts rejected by teacher app
  - No secrets exposed
required_tests:
  - packages/nano_auth/test/fake_auth_repository_test.dart
  - apps/teacher_app/test/teacher_sign_in_page_test.dart
security_checks:
  - no_secrets_in_diff
accessibility_checks: []
manual_test_steps:
  - Review module docs and status
rollback_notes: "Revert module branch commits"
requires_owner_test: true
