  - apps/admin_web/test/community_controls_page_test.dart
security_checks:
  - no_secrets_in_diff
  - server_side_enforcement
accessibility_checks: []
manual_test_steps:
  - Confirm seniors free without school action; juniors blocked; kill switch works
rollback_notes: >
  Revert branch and migrations. Entitlement RPCs and admin page removed.
requires_owner_test: true
owner_decisions_locked:
  scope: >
    Open Communities for seniors; platform emergency kill switch; junior block.
  deferred: >
    Mid-session entitlement refresh; COM-01 create/discover UX.
