  - packages/nano_data/
  - packages/nano_auth/
  - packages/nano_testing/
  - apps/admin_web/
  - apps/student_app/lib/main.dart
  - supabase/migrations/
  - supabase/tests/
  - docs/
  - automation/
  - docs/modules/SAFE-04/
  - automation/modules/SAFE-04.yaml
  - MODULE_STATUS.md
  - PROJECT_STATUS.md
  - TASKS.md
  - CHANGELOG.md
forbidden_paths:
  - supabase/functions/.env.local
  - api_s.txt
  - github.txt
handbook_sections:
  - "Handbook SAFE-01 Community safety / junior exclusion"
ui_references: []
database_scope:
  - public.platform_community_policy
server_functions:
