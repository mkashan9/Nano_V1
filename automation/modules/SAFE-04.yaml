dependency_notes: >
  Open Communities for seniors (Discord-like). Schools do not gate.
  Platform emergency kill switch default on. Junior hard-blocked.
  COM-01+ must call assert_communities_allowed.
applications:
  - student_app
  - admin_web
  - packages
  - supabase
  - docs
  - automation
allowed_paths:
