id: ANA-01
name: "Product Analytics and School Health"
release: R10
status: USER_TEST
dependencies:
  - ADM-08
  - SCH-07
applications:
  - admin_web
  - packages
  - docs
  - automation
allowed_paths:
  - docs/
  - automation/
  - docs/modules/ANA-01/
  - automation/modules/ANA-01.yaml
  - MODULE_STATUS.md
  - PROJECT_STATUS.md
  - TASKS.md
  - CHANGELOG.md
  - AGENTS.md
  - packages/nano_domain/
  - packages/nano_data/
  - apps/admin_web/
forbidden_paths:
  - supabase/functions/.env.local
  - api_s.txt
  - github.txt
handbook_sections:
  - "See docs/handbook/HANDBOOK_TRACEABILITY.md for ANA-01"
ui_references: []
database_scope: []
server_functions: []
acceptance:
  - Documented analytics event taxonomy is visible and privacy-safe
  - School health score is computed from documented inputs
  - Platform analytics and school reports show health without PII
  - Module documentation complete
  - Required tests listed and executed or marked NOT RUN with reason
  - No secrets exposed
  - Owner manual test steps provided
required_tests:
  - packages/nano_domain/test/school_health_test.dart
  - packages/nano_data/test/analytics_health_repository_test.dart
  - apps/admin_web/test/platform_analytics_page_test.dart
  - apps/admin_web/test/school_reports_page_test.dart
  - documentation_review
security_checks:
  - no_secrets_in_diff
accessibility_checks: []
manual_test_steps:
  - Superadmin Analytics → school health + taxonomy
  - School admin Reports → school health card
rollback_notes: "Revert module branch commits"
requires_owner_test: true
