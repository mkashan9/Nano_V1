id: STU-03
name: "Junior Home"
release: R2
status: APPROVED
dependencies:
  - STU-02
  - FND-05
applications:
  - student_app
  - packages
  - docs
  - automation
allowed_paths:
  - docs/
  - automation/
  - docs/modules/STU-03/
  - automation/modules/STU-03.yaml
  - apps/student_app/
  - packages/nano_domain/
  - packages/nano_data/
  - MODULE_STATUS.md
  - PROJECT_STATUS.md
  - TASKS.md
  - CHANGELOG.md
  - AGENTS.md
forbidden_paths:
  - supabase/functions/.env.local
  - api_s.txt
  - github.txt
handbook_sections:
  - "STU-02 Student Home (greeting, continue learning, mission, progress, notifications) — Junior presentation"
ui_references:
  - UI_reference/kids/home
database_scope: []
server_functions: []
acceptance:
  - Junior home answers what happened, what to do next, and how it is going in one screen
  - Home data comes from a repository behind an interface, so live data can replace fixtures without UI changes
  - Loading, error with retry, empty, offline-with-timestamp, and maintenance states all render
  - Junior mission list stays at three items and shows the XP available
  - Companion name from STU-02 preferences is used by the home greeting slot
  - No secrets exposed
required_tests:
  - packages/nano_domain/test/student_home_summary_test.dart
  - packages/nano_data/test/student_home_repository_test.dart
  - apps/student_app/test/junior_home_page_test.dart
  - apps/student_app/test/widget_test.dart
security_checks:
  - no_secrets_in_diff
  - no_client_side_xp_or_progress_writes
accessibility_checks:
  - large_junior_tap_targets
  - locale_copy_en_ur
manual_test_steps:
  - See docs/modules/STU-03/MANUAL_TEST.md
rollback_notes: "Revert module branch commits; StudentLearningTab falls back to JuniorHomeFoundation when no home repository is supplied"
requires_owner_test: true
