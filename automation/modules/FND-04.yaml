id: FND-04
name: "Navigation and Role-Aware Application Shells"
release: R0
status: APPROVED
dependencies:
  - FND-03
applications:
  - student_app
  - teacher_app
  - admin_web
  - packages
  - supabase
  - docs
  - automation
allowed_paths:
  - docs/
  - automation/
  - docs/modules/FND-04/
  - automation/modules/FND-04.yaml
  - automation/scripts/scaffold_fnd04_navigation.py
  - MODULE_STATUS.md
  - PROJECT_STATUS.md
  - TASKS.md
  - CHANGELOG.md
  - AGENTS.md
  - apps/student_app/
  - apps/teacher_app/
  - apps/admin_web/
  - packages/nano_domain/
  - packages/nano_design_system/
  - packages/nano_testing/
forbidden_paths:
  - supabase/functions/.env.local
  - api_s.txt
  - github.txt
handbook_sections:
  - "See docs/handbook/HANDBOOK_TRACEABILITY.md for FND-04"
ui_references: []
database_scope: []
server_functions: []
acceptance:
  - Role catalogs hide unauthorized destinations
  - Independent students have no Flex destination
  - Deep links fall back to safe parent when denied
  - Student, teacher, and admin shells navigate by role
  - Module documentation complete
  - No secrets exposed
  - Owner manual test steps provided
required_tests:
  - packages/nano_domain/test/navigation_guard_test.dart
  - apps/student_app/test/shell_navigation_test.dart
  - apps/student_app/test/widget_test.dart
  - apps/teacher_app/test/widget_test.dart
  - apps/admin_web/test/widget_test.dart
security_checks:
  - no_secrets_in_diff
accessibility_checks: []
manual_test_steps:
  - Review module docs and status
rollback_notes: "Revert module branch commits"
requires_owner_test: true
