id: AUTH-03
name: "School Management and Superadmin Authentication"
release: R1
status: APPROVED
dependencies:
  - SEC-03
  - FND-04
applications:
  - student_app
  - teacher_app
  - admin_web
  - packages
  - supabase
  - docs
  - automation
allowed_paths:
  - docs/
  - automation/
  - docs/modules/AUTH-03/
  - automation/modules/AUTH-03.yaml
  - MODULE_STATUS.md
  - PROJECT_STATUS.md
  - TASKS.md
  - CHANGELOG.md
  - AGENTS.md
  - packages/nano_auth/
  - packages/nano_domain/
  - apps/admin_web/
  - supabase/
forbidden_paths:
  - supabase/functions/.env.local
  - api_s.txt
  - github.txt
handbook_sections:
  - "See docs/handbook/HANDBOOK_TRACEABILITY.md for AUTH-03"
ui_references: []
database_scope:
  - auth.users
  - auth.identities
  - public.profiles
  - public.school_memberships
  - public.platform_roles
  - public.schools
server_functions: []
acceptance:
  - Platform and school admin auth.users fixtures exist
  - admin_web sign-in lands in correct shell by role
  - Sign out returns to sign-in
  - Student/teacher accounts rejected by admin_web
  - No secrets exposed
required_tests:
  - packages/nano_auth/test/fake_auth_repository_test.dart
  - apps/admin_web/test/admin_sign_in_page_test.dart
security_checks:
  - no_secrets_in_diff
accessibility_checks: []
manual_test_steps:
  - Review module docs and status
rollback_notes: "Revert module branch commits"
requires_owner_test: true
