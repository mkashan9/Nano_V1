id: COM-03
name: "Join Requests and Invitations"
release: R9
status: DONE
dependencies:
  - COM-02
dependency_notes: >
  Public join is immediate; private join is pending until owner/admin responds.
  Invite codes grant active membership. SAFE-04 entitlement still enforced.
applications:
  - student_app
  - packages
  - supabase
  - docs
  - automation
allowed_paths:
  - packages/nano_domain/
  - packages/nano_data/
  - apps/student_app/
  - supabase/migrations/
  - supabase/tests/
  - docs/
  - automation/
  - docs/modules/COM-03/
  - automation/modules/COM-03.yaml
  - MODULE_STATUS.md
  - PROJECT_STATUS.md
  - TASKS.md
  - CHANGELOG.md
forbidden_paths:
  - supabase/functions/.env.local
  - api_s.txt
  - github.txt
handbook_sections:
  - "Handbook COM-01 Senior Communities (join/invite slice)"
ui_references: []
database_scope:
  - public.communities
  - public.community_memberships
  - public.community_invites
server_functions:
  - "public.join_community"
  - "public.leave_community"
  - "public.list_join_requests"
  - "public.respond_join_request"
  - "public.create_community_invite"
  - "public.redeem_community_invite"
acceptance:
  - Senior can join public community immediately
  - Private join creates pending request; owners/admins accept or reject
  - Owners/admins can create invite codes; redeem grants active membership
  - Leave works except last-owner protection
  - assert_communities_allowed gates all COM-03 RPCs
required_tests:
  - supabase/tests/com03_join_invitations.sql
  - packages/nano_domain/test/community_discovery_test.dart
  - packages/nano_data/test/community_discovery_repository_test.dart
  - apps/student_app/test/communities_hub_page_test.dart
security_checks:
  - no_secrets_in_diff
  - server_side_enforcement
accessibility_checks: []
manual_test_steps:
  - Join public, request private, redeem invite, leave
rollback_notes: >
  Revert branch and migration. Join/invite RPCs and community_invites removed.
requires_owner_test: true
owner_decisions_locked:
  scope: >
    Join/leave + private requests + invite create/redeem; open communities.
  deferred: >
    Ban/remove member UI; invite revoke list UI; chat.
