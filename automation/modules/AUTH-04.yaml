id: AUTH-04
name: "Independent Student Signup and Recovery"
release: R1
status: DONE
dependencies:
  - AUTH-01
applications:
  - student_app
  - packages
  - supabase
  - docs
  - automation
allowed_paths:
  - docs/
  - automation/
  - docs/modules/AUTH-04/
  - automation/modules/AUTH-04.yaml
  - apps/student_app/
  - apps/teacher_app/lib/main.dart
  - apps/admin_web/lib/main.dart
  - packages/nano_auth/
  - packages/nano_data/lib/src/supabase/
  - supabase/
  - MODULE_STATUS.md
  - PROJECT_STATUS.md
  - TASKS.md
  - CHANGELOG.md
  - AGENTS.md
forbidden_paths:
  - supabase/functions/.env.local
  - api_s.txt
  - github.txt
handbook_sections:
  - "FND-03 Authentication, Sessions, and Role Resolution (independent signup and recovery)"
ui_references: []
database_scope:
  - auth.users
  - public.profiles
  - public.login_events
  - public.device_sessions
  - nano_internal.handle_new_auth_user
server_functions:
  - nano_internal.handle_new_auth_user
acceptance:
  - Independent signup creates exactly one independent_student profile, server-side
  - Forged privileged account_kind metadata provisions nothing
  - Independent accounts receive no school membership and no Flex navigation
  - Recovery never discloses whether an email is registered
  - Profiles cannot outlive their auth identity
  - No secrets exposed
required_tests:
  - supabase/tests/auth04_independent_signup.sql
  - packages/nano_auth/test/independent_signup_test.dart
  - apps/student_app/test/sign_up_page_test.dart
security_checks:
  - no_secrets_in_diff
  - no_client_profile_insert
  - privilege_escalation_via_signup_metadata
accessibility_checks:
  - form_labels_and_inline_errors
manual_test_steps:
  - See docs/modules/AUTH-04/MANUAL_TEST.md
rollback_notes: "Drop trigger on_auth_user_created and the AUTH-04 constraints; revert module branch commits"
requires_owner_test: true
