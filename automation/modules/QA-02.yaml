id: QA-02
name: "Performance and Small-Device Testing"
release: R10
status: USER_TEST
dependencies:
  - FND-03
applications:
  - student_app
  - packages
  - docs
  - automation
allowed_paths:
  - docs/
  - automation/
  - docs/modules/QA-02/
  - automation/modules/QA-02.yaml
  - MODULE_STATUS.md
  - PROJECT_STATUS.md
  - TASKS.md
  - CHANGELOG.md
  - AGENTS.md
  - packages/nano_domain/
  - packages/nano_data/
  - apps/student_app/
forbidden_paths:
  - supabase/functions/.env.local
  - api_s.txt
  - github.txt
handbook_sections:
  - "See docs/handbook/HANDBOOK_TRACEABILITY.md for QA-02"
ui_references: []
database_scope: []
server_functions: []
acceptance:
  - Small-phone (360px) smoke checklist is executable from Me
  - Junior/senior phone column density stays aligned with FND-03
  - Text-scale 1.3 smoke budget is covered
  - Module documentation complete
  - Required tests listed and executed or marked NOT RUN with reason
  - No secrets exposed
  - Owner manual test steps provided
required_tests:
  - packages/nano_domain/test/performance_audit_test.dart
  - packages/nano_data/test/performance_audit_repository_test.dart
  - apps/student_app/test/performance_audit_page_test.dart
  - documentation_review
security_checks:
  - no_secrets_in_diff
accessibility_checks: []
manual_test_steps:
  - Me → Performance & small device → all checks passed
rollback_notes: "Revert module branch commits"
requires_owner_test: true
